<!doctype html>
<html lang="en">
    <head>
        <title>Travelog</title>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO -->
        <meta
            name="description"
            content="Discover beautiful destinations and explore the world with our Traveling Website."
        />
        <meta name="author" content="Prathmesh Ojha" />
        <meta name="robots" content="index, follow" />

        <!-- Browser Appearance -->
        <meta name="theme-color" content="#ffffff" />

        <!-- Open Graph -->
        <meta property="og:title" content="Traveling Website" />
        <meta
            property="og:description"
            content="Discover beautiful destinations around the world."
        />
        <meta property="og:type" content="website" />
        <meta
            property="og:image"
            content="%VITE_SITE_URL%/assets/images/travelling/traveling-bg.webp"
        />
        <meta property="og:url" content="%VITE_SITE_URL%/" />
    </head>

    <body>
        <noscript>
            <p>
                JavaScript is disabled in your browser. Please enable JavaScript
                to use this website.
            </p>
        </noscript>
        <div class="container">
            <nav class="navbar" aria-label="Main navigation">
                <!-- Region 1: Hamburger (visible on mobile + tablet only) -->
                <button
                    class="navbar__hamburger"
                    id="nav-hamburger"
                    aria-label="Open menu"
                    aria-expanded="false"
                    aria-controls="nav-drawer"
                >
                    <img
                        src="/assets/menu.svg"
                        alt=""
                        class="navbar__menu-icon"
                    />
                </button>

                <!-- Region 2: Logo (always visible) -->
                <a
                    href="/"
                    class="navbar__logo-link"
                    aria-label="Travelog home"
                >
                    <img
                        src="/assets/logos/logo.svg"
                        alt="Travelog"
                        class="navbar__logo"
                    />
                </a>

                <!-- Region 3: Nav links — inline on desktop, drawer on mobile/tablet -->
                <ul class="navbar__links" id="nav-drawer" role="list">
                    <li class="navbar__link-item">
                        <a href="#" class="navbar__link navbar__link--active"
                            >Home</a
                        >
                    </li>
                    <li class="navbar__link-item">
                        <a href="#" class="navbar__link">Discover</a>
                    </li>
                    <li class="navbar__link-item">
                        <a href="#" class="navbar__link">Special Deals</a>
                    </li>
                    <li class="navbar__link-item">
                        <a href="#" class="navbar__link">Contact</a>
                    </li>
                </ul>

                <!-- Region 4: CTA buttons (hidden on mobile, visible tablet+) -->
                <div class="navbar__actions">
                    <a href="#" class="navbar__btn navbar__btn--ghost"
                        >Log In</a
                    >
                    <a href="#" class="navbar__btn navbar__btn--primary"
                        >Sign Up</a
                    >
                </div>
            </nav>

            <!-- Overlay for drawer close on outside click -->
            <div class="navbar__overlay" id="navbar-overlay" aria-hidden="true">
                <div class="navbar__back-container">
                    <svg
                        xmlns="http://w3.org"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        id="back-button"
                    >
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </div>
            </div>
        </div>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
