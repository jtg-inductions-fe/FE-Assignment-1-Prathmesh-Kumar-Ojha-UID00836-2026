<!doctype html>
<html lang="en">
    <head>
        <title>Travelog</title>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO -->
        <meta
            name="description"
            content="Discover beautiful destinations and explore the world with our Traveling Website."
        />
        <meta name="author" content="Prathmesh Ojha" />
        <meta name="robots" content="index, follow" />

        <!-- Browser Appearance -->
        <meta name="theme-color" content="#ffffff" />

        <!-- Open Graph -->
        <meta property="og:title" content="Traveling Website" />
        <meta
            property="og:description"
            content="Discover beautiful destinations around the world."
        />
        <meta property="og:type" content="website" />
        <meta
            property="og:image"
            content="%VITE_SITE_URL%/assets/images/travelling/traveling-bg.webp"
        />
        <meta property="og:url" content="%VITE_SITE_URL%/" />
        <link rel="preconnect" href="https://rsms.me/" />
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>

    <body>
        <noscript>
            <p>
                JavaScript is disabled in your browser. Please enable JavaScript
                to use this website.
            </p>
        </noscript>

        <div class="navbar-wrapper">
            <!-- Navbar -->
            <nav class="navbar" aria-label="Main navigation">
                <!-- Hamburger -->
                <button
                    class="navbar__menu-toggle"
                    id="nav-hamburger"
                    aria-label="Open menu"
                    aria-expanded="false"
                    aria-controls="nav-drawer"
                >
                    <img
                        src="/assets/menu.svg"
                        alt="Hamburger menu icon"
                        class="navbar__menu-icon"
                    />
                </button>

                <!-- Logo -->
                <a href="/" class="navbar__logo" aria-label="Travelog home">
                    <img
                        src="/assets/logos/logo.svg"
                        alt="Travlog logo"
                        class="navbar__logo-image"
                    />
                </a>

                <!-- Navigation links -->
                <ul class="navbar__list" id="nav-drawer" role="list">
                    <li class="navbar__item">
                        <a href="#" class="navbar__link">Home</a>
                    </li>
                    <li class="navbar__item">
                        <a href="#" class="navbar__link">Discover</a>
                    </li>
                    <li class="navbar__item">
                        <a href="#" class="navbar__link">Special Deals</a>
                    </li>
                    <li class="navbar__item">
                        <a href="#" class="navbar__link">Contact</a>
                    </li>
                </ul>

                <!-- CTA buttons -->
                <div class="navbar__actions">
                    <a href="#" class="button button--ghost">Log In</a>
                    <a href="#" class="button button--primary">Sign Up</a>
                </div>
            </nav>

            <!-- Navigation drawer -->
            <div class="navbar-drawer" id="navbar-overlay">
                <button
                    type="button"
                    class="navbar-drawer__close-button"
                    id="back-button"
                    aria-label="Close menu"
                    aria-controls="nav-drawer"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                        class="navbar-drawer__icon"
                    >
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>
            </div>
        </div>

        <main class="container"></main>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
