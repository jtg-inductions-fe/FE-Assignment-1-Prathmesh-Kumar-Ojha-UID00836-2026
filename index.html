<!doctype html>
<html lang="en">
    <head>
        <title>Travelog</title>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO -->
        <meta
            name="description"
            content="Discover beautiful destinations and explore the world with our Traveling Website."
        />
        <meta name="author" content="Prathmesh Ojha" />
        <meta name="robots" content="index, follow" />

        <!-- Browser Appearance -->
        <meta name="theme-color" content="#ffffff" />

        <!-- Open Graph -->
        <meta property="og:title" content="Traveling Website" />
        <meta
            property="og:description"
            content="Discover beautiful destinations around the world."
        />
        <meta property="og:type" content="website" />
        <meta
            property="og:image"
            content="%VITE_SITE_URL%/assets/images/travelling/traveling-bg.webp"
        />
        <meta property="og:url" content="%VITE_SITE_URL%/" />
    </head>

    <body>
        <div class="container">
            <nav class="navbar">
                <div class="logo-container">
                    <img src="./assets/logo.svg" alt="logo" class="logo" />
                </div>
                <div class="drawer">
                    <div class="hamburger">
                        <img
                            src="./assets/menu.svg"
                            alt="hamburger-menu"
                            class="menu-icon"
                        />
                    </div>
                </div>
            </nav>
        </div>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
