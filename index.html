<!doctype html>
<html lang="en">
    <head>
        <title>Travelog</title>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO -->
        <meta
            name="description"
            content="Discover beautiful destinations and explore the world with our Traveling Website."
        />
        <meta name="author" content="Prathmesh Ojha" />
        <meta name="robots" content="index, follow" />

        <!-- Browser Appearance -->
        <meta name="theme-color" content="#ffffff" />

        <!-- Open Graph -->
        <meta property="og:title" content="Traveling Website" />
        <meta
            property="og:description"
            content="Discover beautiful destinations around the world."
        />
        <meta property="og:type" content="website" />
        <meta
            property="og:image"
            content="%VITE_SITE_URL%/assets/images/travelling/traveling-bg.webp"
        />
        <meta property="og:url" content="%VITE_SITE_URL%/" />
    </head>

    <body>
        <noscript>
            <p>
                JavaScript is disabled in your browser. Please enable JavaScript
                to use this website.
            </p>
        </noscript>

        <div class="container">
            <!-- Navbar -->
            <nav class="navbar" aria-label="Main navigation">
                <!-- Hamburger -->
                <button
                    class="navbar__menu-toggle"
                    id="nav-hamburger"
                    aria-label="Open menu"
                    aria-expanded="false"
                    aria-controls="nav-drawer"
                >
                    <img
                        src="/assets/menu.svg"
                        alt="Hamburger menu icon"
                        class="navbar__menu-icon"
                    />
                </button>

                <!-- Logo -->
                <a href="/" class="navbar__logo" aria-label="Travelog home">
                    <img
                        src="/assets/logos/logo.svg"
                        alt="Travlog logo"
                        class="navbar__logo-image"
                    />
                </a>

                <!-- Navigation links -->
                <ul class="navbar__list" id="nav-drawer" role="list">
                    <li class="navbar__item">
                        <a href="#" class="navbar__link">Home</a>
                    </li>
                    <li class="navbar__item">
                        <a href="#" class="navbar__link">Discover</a>
                    </li>
                    <li class="navbar__item">
                        <a href="#" class="navbar__link">Special Deals</a>
                    </li>
                    <li class="navbar__item">
                        <a href="#" class="navbar__link">Contact</a>
                    </li>
                </ul>

                <!-- CTA buttons -->
                <div class="navbar__actions">
                    <a href="#" class="button button--ghost">Log In</a>
                    <a href="#" class="button button--primary">Sign Up</a>
                </div>
            </nav>

            <!-- Navigation drawer -->
            <div class="navbar-drawer" id="navbar-overlay">
                <button
                    type="button"
                    class="navbar-drawer__close-button"
                    id="back-button"
                    aria-label="Close menu"
                    aria-controls="nav-drawer"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                        class="navbar-drawer__icon"
                    >
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>
            </div>

            <!-- Hero -->
            <main class="hero" aria-labelledby="hero-title">
                <div class="hero__gallery">
                    <div
                        class="hero__gallery-column hero__gallery-column--left"
                    >
                        <div
                            class="hero__gallery-item hero__gallery-item--first"
                        >
                            <img
                                src="/assets/images/hero/hero-1.avif"
                                alt="Santorini coastal village overlooking the sea"
                                class="hero__image"
                                id="img-1"
                            />

                            <div
                                class="hero__decoration hero__decoration--plane"
                            >
                                <img
                                    class="hero__decoration-image"
                                    src="/assets/images/illustrations/plane.svg"
                                    alt="Plane decorator"
                                />
                            </div>
                        </div>

                        <div
                            class="hero__gallery-item hero__gallery-item--second"
                        >
                            <img
                                src="/assets/images/hero/hero-2.avif"
                                alt="Traveler enjoying a mountain view"
                                class="hero__image"
                                id="img-2"
                            />
                        </div>
                    </div>

                    <div
                        class="hero__gallery-column hero__gallery-column--right"
                    >
                        <div
                            class="hero__gallery-item hero__gallery-item--third"
                        >
                            <img
                                src="/assets/images/hero/hero-3.avif"
                                alt="Traveler exploring a city with a backpack"
                                class="hero__image"
                                id="img-3"
                            />

                            <div
                                class="hero__decoration hero__decoration--location"
                            >
                                <img
                                    class="hero__decoration-image hero__decoration-image--location"
                                    src="/assets/images/illustrations/location.svg"
                                    alt="Location decorator"
                                />

                                <p class="hero__decoration-location-title">
                                    Top Places
                                </p>
                            </div>

                            <div
                                class="hero__decoration hero__decoration--profile"
                            >
                                <img
                                    class="hero__decoration-image"
                                    src="/assets/images/illustrations/profile.svg"
                                    alt="Profile decorator"
                                />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="hero__main">
                    <div class="hero__explore" id="explore-button">
                        <p class="hero__explore-title">Explore the world!</p>
                        <img
                            class="hero__explore-image"
                            src="/assets/images/illustrations/briefcase.svg"
                            alt="Explore briefcase icon"
                        />
                    </div>

                    <h1 class="hero__title" id="hero-title">
                        Travel
                        <span class="hero__title-highlight"
                            >top destination</span
                        >of the world
                    </h1>

                    <p class="hero__subtitle">
                        We always make our customer happy by
                        <span class="hero__subtitle-break">providing</span> as
                        many choices as possible
                    </p>

                    <div class="hero__actions">
                        <a class="button button--primary" href="#"
                            >Get Started</a
                        >
                        <a class="button button--ghost" href="#">
                            <img
                                class="button__icon"
                                src="/assets/images/illustrations/play.svg"
                                alt="Play icon"
                            />
                            <p class="button__text">Watch Demo</p>
                        </a>
                    </div>
                </div>

                <div class="hero__vector">
                    <img
                        src="/assets/images/illustrations/arrow-decorators.svg"
                        alt="Arrow decorators"
                    />
                </div>
            </main>
        </div>

        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
